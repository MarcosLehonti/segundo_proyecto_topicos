schema: spec-driven

context: |
  Proyecto: Billetera y Presupuesto Personal (Estilo YNAB)
  Stack Tecnológico: React, TypeScript, Vite, TailwindCSS, Lucide-react, Recharts
  Persistencia: LocalStorage con soporte de Import/Export JSON
  Idioma principal UI / Specs / Comunicación: Español
  Convención de Código: Todo el código fuente (TypeScript, nombres de variables, interfaces, funciones, componentes) debe escribirse en Inglés.
  Dominio: Finanzas personales, presupuesto base cero, gestión de planes de presupuesto, cuentas y multimoneda sin pasarelas reales.

